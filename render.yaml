# Render Blueprint for JobPilot AI
# Deploy: Render dashboard -> "New" -> "Blueprint" -> select this repo.
# Requires setting GROQ_API_KEY and TELEGRAM_BOT_TOKEN in the dashboard
# when prompted (they are marked sync:false below - never commit secrets).

databases:
  - name: jobpilot-db
    plan: free
    databaseName: jobpilot
    user: jobpilot

services:
  # ------------------------------------------------------------
  # Backend - FastAPI + Playwright + Telegram bot + scheduler.
  # Starter (paid) so the service never sleeps and the 24/7 agent
  # keeps running. Free tier sleeps after 15 min idle -> bot stops.
  # ------------------------------------------------------------
  - type: web
    name: jobpilot-backend
    runtime: docker
    rootDir: backend
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: JobPilot_Update_AI_Bot
      - key: SECRET_KEY
        generateValue: true
      - key: SCHEDULER_ENABLED
        value: "true"
      # Render injects the frontend's public URL here (plain string is
      # accepted by config.py alongside the JSON array form).
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: jobpilot-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ------------------------------------------------------------
  # Frontend - Next.js. Free is fine (serves the UI on demand).
  # NEXT_PUBLIC_API_URL is baked into the bundle at build time, so it
  # references the backend's public URL via fromService.
  # ------------------------------------------------------------
  - type: web
    name: jobpilot-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: jobpilot-backend
          envVarKey: RENDER_EXTERNAL_URL
